# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (crates/tlsfp-worker/src/lib.rs); the answers live here, keyed by task name, so the
# agent being graded never sees them. vgi-lint discovers this file in the
# directory it runs from (the repo root in CI).

tasks:
  - name: "ja4_of_clienthello"
    reference_sql: "SELECT tlsfp.main.ja4(from_hex('')) AS ja4"
    unordered: false
    ignore_column_names: true
  - name: "ja3_from_extracted_fields"
    reference_sql: "SELECT tlsfp.main.ja3_from_parts(771, [4865,4866,4867,49195,49199], [0,11,10,13], [29,23,24], [0]) AS ja3"
    unordered: false
    ignore_column_names: true
  - name: "guard_then_ja3"
    reference_sql: "SELECT tlsfp.main.is_tls_handshake(from_hex('')) AS is_handshake, tlsfp.main.ja3(from_hex('')) AS ja3"
    unordered: false
    ignore_column_names: true
  - name: "ja3s_of_serverhello"
    reference_sql: "SELECT tlsfp.main.ja3s(from_hex('020000360303222222222222222222222222222222222222222222222222222222222222222200c02f00000eff01000100001000050003026832')) AS ja3s"
    unordered: false
    ignore_column_names: true
  - name: "ja3s_from_extracted_fields"
    reference_sql: "SELECT tlsfp.main.ja3s_from_parts(771, 49199, [65281, 16]) AS ja3s"
    unordered: false
    ignore_column_names: true
  - name: "ja3_pre_hash_string"
    reference_sql: "SELECT tlsfp.main.ja3_string(from_hex('')) AS ja3_string"
    unordered: false
    ignore_column_names: true
  - name: "ja4_raw_of_clienthello"
    reference_sql: "SELECT tlsfp.main.ja4_raw(from_hex('')) AS ja4_raw"
    unordered: false
    ignore_column_names: true
  - name: "ja4_from_extracted_fields"
    reference_sql: "SELECT tlsfp.main.ja4_from_parts(772, [4865,4866], [0,43,13], [1027,2052], 'h2') AS ja4"
    unordered: false
    ignore_column_names: true
  - name: "decode_clienthello_sni"
    reference_sql: "SELECT (tlsfp.main.parse_client_hello(from_hex(''))).sni AS sni"
    unordered: false
    ignore_column_names: true
